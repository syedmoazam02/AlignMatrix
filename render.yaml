services:
  - type: web
    name: alignmatrix-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: alignmatrix-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: PORT
        value: 8000

databases:
  - name: alignmatrix-db
    plan: free
    region: oregon
    databaseName: alignmatrix
    user: alignmatrix_user
